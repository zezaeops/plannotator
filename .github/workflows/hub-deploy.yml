name: Deploy Plan Hub

on:
  push:
    branches: [plan-hub]
    paths:
      - 'apps/plan-hub/**'
      - 'packages/server/storage.ts'
      - 'packages/ui/**'
      - 'packages/editor/index.css'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test apps/plan-hub/src/index.test.ts

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/plan-hub/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/plan-hub:latest
            ghcr.io/${{ github.repository }}/plan-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
